services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products_user
      POSTGRES_PASSWORD: products_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "products_user", "-d", "products"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Products.Web/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=products;Username=products_user;Password=products_password"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Products.Web/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=products;Username=products_user;Password=products_password"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: