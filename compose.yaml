services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: products_user
      POSTGRES_PASSWORD: products_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "products_user", "-d", "products"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: